<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Multa de Fidelidade</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>📄 Calculadora de Multa de Fidelidade</h1>

        <div class="campo">
            <label for="multaTotal">Valor da Multa Total</label>

            <select id="multaTotal">
                <option value="300">R$ 300,00</option>
                <option value="900">R$ 900,00</option>
                <option value="1500">R$ 1.500,00</option>
            </select>
        </div>

        <div class="campo">
            <label for="fidelidade">Fidelidade (Meses)</label>

            <input
                type="number"
                id="fidelidade"
                value="12"
                min="1"
            >
        </div>

        <div class="campo">
            <label for="contrato">Data do Contrato</label>

            <input
                type="date"
                id="contrato"
            >
        </div>

        <div class="campo">
            <label for="cancelamento">Data do Cancelamento</label>

            <input
                type="date"
                id="cancelamento"
            >
        </div>

        <button type="button" onclick="calcular()">
            CALCULAR
        </button>

        <div id="resultado"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
