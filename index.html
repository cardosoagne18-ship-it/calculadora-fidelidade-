<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Multa de Fidelidade</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- LOGO YO TELECOM -->
        <div class="logo-area">
            <img src="logo-yo-final.png" alt="YO Telecom">
        </div>

        <!-- TÍTULO -->
        <div class="titulo-area">

            <div class="icone-calculadora">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="5" y="2" width="14" height="20" rx="2"></rect>
                    <line x1="8" y1="6" x2="16" y2="6"></line>

                    <circle cx="9" cy="11" r="1"></circle>
                    <circle cx="15" cy="11" r="1"></circle>
                    <circle cx="9" cy="16" r="1"></circle>
                    <circle cx="15" cy="16" r="1"></circle>
                </svg>
            </div>

            <h1>Calculadora de Multa de Fidelidade</h1>

        </div>

        <!-- CARD PRINCIPAL -->
        <section class="formulario">

            <!-- VALOR DA MULTA -->
            <div class="campo">

                <label for="multaTotal">
                    Valor da Multa Total
                </label>

                <select id="multaTotal">
                    <option value="300">R$ 300,00</option>
                    <option value="900">R$ 900,00</option>
                    <option value="1500">R$ 1.500,00</option>
                </select>

            </div>

            <!-- FIDELIDADE -->
            <div class="campo">

                <label for="fidelidade">
                    Fidelidade (Meses)
                </label>

                <input
                    type="number"
                    id="fidelidade"
                    value="12"
                    min="1"
                >

            </div>

            <!-- DATA DO CONTRATO -->
            <div class="campo">

                <label for="contrato">
                    Data do Contrato
                </label>

                <input
                    type="date"
                    id="contrato"
                >

            </div>

            <!-- DATA DO CANCELAMENTO -->
            <div class="campo">

                <label for="cancelamento">
                    Data do Cancelamento
                </label>

                <input
                    type="date"
                    id="cancelamento"
                >

            </div>

            <!-- BOTÃO CALCULAR -->
            <button
                type="button"
                class="btn-calcular"
                onclick="calcular()"
            >

                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="5" y="2" width="14" height="20" rx="2"></rect>
                    <line x1="8" y1="6" x2="16" y2="6"></line>

                    <circle cx="9" cy="11" r="1"></circle>
                    <circle cx="15" cy="11" r="1"></circle>
                    <circle cx="9" cy="16" r="1"></circle>
                    <circle cx="15" cy="16" r="1"></circle>
                </svg>

                <span>CALCULAR</span>

            </button>

            <!-- RESULTADO -->
            <div id="resultado">

                <h2>Resultado</h2>

                <div class="resultado-item">
                    <strong>Multa contratual:</strong>
                    <span>R$ 0,00</span>
                </div>

                <div class="resultado-item">
                    <strong>Dias utilizados:</strong>
                    <span>0</span>
                </div>

                <div class="resultado-item">
                    <strong>Tempo utilizado:</strong>
                    <span class="info">0 meses e 0 dias</span>
                </div>

                <div class="resultado-item">
                    <strong>Dias restantes:</strong>
                    <span>0</span>
                </div>

                <div class="resultado-item">
                    <strong>Tempo restante:</strong>
                    <span class="info">0 meses e 0 dias</span>
                </div>

                <hr>

                <div class="resultado-multa">

                    <strong>Valor da Multa:</strong>

                    <span class="valor">
                        R$ 0,00
                    </span>

                </div>

            </div>

        </section>

    </main>

    <!-- SCRIPT ORIGINAL - NÃO ALTERAR -->
    <script src="script.js"></script>

</body>

</html>
